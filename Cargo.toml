[package]
name = "cutex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cutex"
path = "src/main.rs"

[features]
archive-agent-bus-roster-test-fixture = []
archive-conflict-test-hook = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
toml = "0.8"
url = "2"
shlex = "1"
sha2 = "0.10"
jsonschema = { version = "0.30", default-features = false }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
tui-input = { version = "0.15", default-features = false }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
