[package]
name = "cutex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cutex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
toml = "0.8"
url = "2"
shlex = "1"
